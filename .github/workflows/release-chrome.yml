name: Release Chrome Extension

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: '版本递增类型'
        required: true
        type: choice
        options:
          - patch    # 补丁版本：修复 Bug，1.0.0 → 1.0.1
          - minor    # 次版本：新增功能，1.0.0 → 1.1.0
          - major    # 主版本：重大变更，1.0.0 → 2.0.0
        default: patch
      release_type:
        description: '发布类型'
        required: true
        type: choice
        options:
          - release
          - prerelease
        default: release

permissions:
  contents: write

jobs:
  release-chrome:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取完整 git 历史
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 安装 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # 4. 安装依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. 自增版本号并提取新版本
      - name: Bump version
        id: bump
        run: |
          npm version ${{ inputs.version_type }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "🔖 New version: v$NEW_VERSION"

      # 6. 提交版本变更并打 tag
      - name: Commit and Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "release(chrome): v${{ steps.bump.outputs.VERSION }}"
          git tag -a "v${{ steps.bump.outputs.VERSION }}" -m "release(chrome): v${{ steps.bump.outputs.VERSION }}"
          git push origin HEAD --follow-tags

      # 7. 构建 Chrome 版本
      - name: Build Chrome Extension
        run: pnpm build:chrome

      # 8. 打包为 zip
      - name: Package zip
        run: cd build/chrome-mv3-prod && zip -r ../../fe-tools-chrome-v${{ steps.bump.outputs.VERSION }}.zip . && cd ../..

      # 9. 创建 GitHub Release（自动生成 changelog）
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.VERSION }}
          name: Chrome v${{ steps.bump.outputs.VERSION }}
          generate_release_notes: true
          prerelease: ${{ inputs.release_type == 'prerelease' }}
          files: fe-tools-chrome-v${{ steps.bump.outputs.VERSION }}.zip

      # 10. 获取 OAuth2 Access Token
      - name: Get Access Token
        id: auth
        run: |
          RESPONSE=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${{ secrets.CHROME_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.CHROME_CLIENT_SECRET }}" \
            -d "refresh_token=${{ secrets.CHROME_REFRESH_TOKEN }}" \
            -d "grant_type=refresh_token")
          echo "::debug::Token response: $RESPONSE"
          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Failed to get access token. Response: $RESPONSE"
            exit 1
          fi
          echo "::add-mask::$ACCESS_TOKEN"
          echo "TOKEN=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
          echo "✅ Access token obtained successfully"

      # 11. 上传到 Chrome Web Store (V2 API)
      - name: Upload to Chrome Web Store
        id: upload
        run: |
          PUBLISHER_ID="${{ secrets.CHROME_PUBLISHER_ID }}"
          EXTENSION_ID="${{ secrets.CHROME_EXTENSION_ID }}"
          TOKEN="${{ steps.auth.outputs.TOKEN }}"
          ZIP_FILE="fe-tools-chrome-v${{ steps.bump.outputs.VERSION }}.zip"

          echo "📦 Uploading $ZIP_FILE ..."
          UPLOAD_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-goog-api-version: 2" \
            -X POST \
            -T "$ZIP_FILE" \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:upload")

          HTTP_CODE=$(echo "$UPLOAD_RESPONSE" | tail -1)
          BODY=$(echo "$UPLOAD_RESPONSE" | sed '$d')
          echo "Upload HTTP status: $HTTP_CODE"
          echo "Upload response: $BODY"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Upload failed with HTTP $HTTP_CODE: $BODY"
            exit 1
          fi

          UPLOAD_STATE=$(echo "$BODY" | jq -r '.uploadState')
          echo "Upload state: $UPLOAD_STATE"

          # 如果上传仍在处理中，轮询 fetchStatus
          if [ "$UPLOAD_STATE" = "UPLOAD_IN_PROGRESS" ]; then
            echo "⏳ Upload in progress, polling for status..."
            for i in $(seq 1 12); do
              sleep 10
              STATUS_RESPONSE=$(curl -s \
                -H "Authorization: Bearer $TOKEN" \
                -H "x-goog-api-version: 2" \
                "https://chromewebstore.googleapis.com/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:fetchStatus")
              ASYNC_STATE=$(echo "$STATUS_RESPONSE" | jq -r '.lastAsyncUploadState')
              echo "Poll #$i - lastAsyncUploadState: $ASYNC_STATE"
              if [ "$ASYNC_STATE" = "SUCCESS" ]; then
                echo "✅ Upload completed successfully"
                break
              elif [ "$ASYNC_STATE" = "FAILURE" ]; then
                echo "::error::Upload processing failed: $STATUS_RESPONSE"
                exit 1
              fi
            done
            if [ "$ASYNC_STATE" = "UPLOAD_IN_PROGRESS" ]; then
              echo "::error::Upload timed out after 120 seconds"
              exit 1
            fi
          elif [ "$UPLOAD_STATE" = "FAILURE" ]; then
            echo "::error::Upload failed: $BODY"
            exit 1
          else
            echo "✅ Upload state: $UPLOAD_STATE"
          fi

      # 12. 发布到 Chrome Web Store (V2 API)
      - name: Publish to Chrome Web Store
        run: |
          PUBLISHER_ID="${{ secrets.CHROME_PUBLISHER_ID }}"
          EXTENSION_ID="${{ secrets.CHROME_EXTENSION_ID }}"
          TOKEN="${{ steps.auth.outputs.TOKEN }}"

          echo "🚀 Publishing extension..."
          PUBLISH_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-goog-api-version: 2" \
            -X POST \
            "https://chromewebstore.googleapis.com/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:publish")

          HTTP_CODE=$(echo "$PUBLISH_RESPONSE" | tail -1)
          BODY=$(echo "$PUBLISH_RESPONSE" | sed '$d')
          echo "Publish HTTP status: $HTTP_CODE"
          echo "Publish response: $BODY"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Publish failed with HTTP $HTTP_CODE: $BODY"
            exit 1
          fi
          echo "✅ Extension submitted for review and publishing"
